{% extends "digital/base.html" %}

{% block content %}
<div class="auth-container"
    style="max-width: 400px; margin: 40px auto; padding: 20px; background: #1a1a1a; border-radius: 12px;">
    <h2 style="color: #fff;">Reset Password</h2>
    <p style="color: #aaa;">Enter your email and we'll send you a link to reset your password.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Send Reset Link</button>
    </form>
    <p style="margin-top: 16px; text-align: center;">
        <a href="{% url 'login' %}" style="color: #00E5A8;">Back to login</a>
    </p>
</div>
{% endblock %}
